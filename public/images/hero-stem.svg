<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="Illustration of an atom, flask, bar chart and exam paper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="flask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="480" rx="28" fill="url(#bg)"/>

  <!-- Orbits -->
  <g fill="none" stroke="#2563eb" stroke-width="3" opacity="0.35">
    <ellipse cx="300" cy="210" rx="210" ry="80"/>
    <ellipse cx="300" cy="210" rx="210" ry="80" transform="rotate(60 300 210)"/>
    <ellipse cx="300" cy="210" rx="210" ry="80" transform="rotate(-60 300 210)"/>
  </g>

  <!-- Nucleus -->
  <circle cx="300" cy="210" r="34" fill="#2563eb"/>
  <circle cx="288" cy="198" r="8" fill="#93c5fd"/>

  <!-- Electrons -->
  <circle cx="510" cy="210" r="11" fill="#f5a623"/>
  <circle cx="90" cy="210" r="11" fill="#f5a623"/>
  <circle cx="300" cy="90" r="11" fill="#1d4ed8"/>
  <circle cx="300" cy="330" r="11" fill="#1d4ed8"/>

  <!-- Exam paper with ticks -->
  <g transform="translate(60 300) rotate(-8)">
    <rect width="150" height="120" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
    <rect x="18" y="22" width="100" height="8" rx="4" fill="#bfdbfe"/>
    <rect x="18" y="42" width="80" height="8" rx="4" fill="#bfdbfe"/>
    <rect x="18" y="62" width="90" height="8" rx="4" fill="#bfdbfe"/>
    <path d="M22 96 l12 12 l24 -26" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 96 l12 12 l24 -26" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flask -->
  <g transform="translate(400 280)">
    <path d="M30 0 h40 v40 l38 70 q8 16 -10 26 h-96 q-18 -10 -10 -26 l38 -70 z" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
    <path d="M22 96 h96 l10 26 q4 14 -12 18 h-92 q-16 -4 -12 -18 z" fill="url(#flask)"/>
    <circle cx="48" cy="112" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="82" cy="104" r="4" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Bar chart -->
  <g transform="translate(330 380)">
    <rect x="0" y="50" width="26" height="40" rx="4" fill="#93c5fd"/>
    <rect x="36" y="30" width="26" height="60" rx="4" fill="#60a5fa"/>
    <rect x="72" y="8" width="26" height="82" rx="4" fill="#2563eb"/>
    <rect x="108" y="36" width="26" height="54" rx="4" fill="#f5a623"/>
  </g>
</svg>
